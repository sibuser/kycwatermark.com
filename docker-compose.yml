name: kycwatermark

services:
  # Production image: static build served by nginx on http://localhost:8080
  web:
    build:
      context: .
      target: runtime
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
    image: kycwatermark:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Vite dev server with hot reload on http://localhost:5173
  # Start with: docker compose --profile dev up dev
  dev:
    profiles:
      - dev
    build:
      context: .
      target: build
    command: pnpm dev --host 0.0.0.0
    environment:
      COMMIT_HASH: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep the image's installed dependencies instead of shadowing them with the host's.
      - dev_node_modules:/app/node_modules

volumes:
  dev_node_modules:
